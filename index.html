<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Calendar — Savannah</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div><div class="eyebrow">SAVANNAH + ~60 MIN DRIVE</div><h1>Free Calendar</h1><p>Free first. Cheap if it’s worth it. Weird local stuff encouraged.</p></div><div class="summary" id="summary"></div></header>
<main class="layout"><section class="calendar-panel"><div class="toolbar"><button id="prevMonth">←</button><h2 id="monthLabel"></h2><div><button id="todayBtn">Today</button><button id="nextMonth">→</button></div></div><div class="filters"><label><input type="radio" name="cost" value="20" checked> ≤ $20</label><label><input type="radio" name="cost" value="10"> ≤ $10</label><label><input type="radio" name="cost" value="0"> Free only</label><label><input type="checkbox" id="hideUnknown"> Hide unknown-price</label></div><div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="calendar" class="calendar"></div></section>
<aside class="events-panel"><div class="events-heading"><div><div class="eyebrow">SELECTED DATE</div><h2 id="selectedDate"></h2></div><button id="showAll">Month</button></div><div id="eventList" class="event-list"></div><section class="imports-panel"><div class="eyebrow">FACEBOOK</div><h3>Social discovery</h3><div id="facebookImports"></div></section></aside></main>
<footer>Hosted Free Calendar · Savannah, Georgia</footer><script src="app.js"></script></body></html>
